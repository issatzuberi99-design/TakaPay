<div class="ds-form-field{% if field.errors %} ds-form-field--error{% endif %}">
    <label for="{{ field.id_for_label }}">
        {{ label|default:field.label }}
        {% if field.field.required %}<span class="ds-required" aria-hidden="true">*</span><span class="ds-visually-hidden">Required</span>{% endif %}
    </label>
    {{ field }}
    {% if field.help_text %}<small class="ds-help">{{ field.help_text }}</small>{% endif %}
    {% for error in field.errors %}<p class="ds-error">{{ error }}</p>{% endfor %}
</div>
