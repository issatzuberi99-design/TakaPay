<header class="site-header">
    <a class="ds-wordmark brand" href="{% url 'home' %}" aria-label="TakaPay home"><span>Taka</span><em>Pay</em></a>
    <nav aria-label="Main navigation">
        {% if user.is_authenticated %}
            <a class="ds-button ds-button--quiet site-nav__button" href="{% url 'home' %}">Home</a>
            {% if user.role == "admin" or user.is_staff %}
                <a class="ds-button ds-button--secondary site-nav__button" href="{% url 'admin_dashboard' %}">Dashboard</a>
            {% elif user.role == "collector" %}
                <a class="ds-button ds-button--secondary site-nav__button" href="{% url 'dashboard' %}">Dashboard</a>
            {% else %}
                <a class="ds-button ds-button--secondary site-nav__button" href="{% url 'dashboard' %}">Dashboard</a>
            {% endif %}
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button class="ds-button ds-button--primary nav-button" type="submit">Logout</button>
            </form>
        {% else %}
            <a class="ds-button ds-button--quiet site-nav__button" href="{% url 'home' %}">Home</a>
            <a class="ds-button ds-button--quiet site-nav__button" href="{% url 'marketplace' %}">Marketplace</a>
            <a class="ds-button ds-button--quiet site-nav__button" href="{% url 'login' %}">Login</a>
            <a class="ds-button ds-button--primary nav-button" href="{% url 'register' %}">Register</a>
        {% endif %}
    </nav>
</header>
