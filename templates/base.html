{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d5c63">
    <meta name="description" content="TakaPay turns recyclable waste into value in Zanzibar.">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/layouts.css' %}">
    <link rel="stylesheet" href="{% static 'css/site.css' %}">
    <title>{% block title %}TakaPay{% endblock %}</title>
</head>
<body class="{% block body_class %}{% endblock %}">
    {% include "components/navigation.html" %}
    {% include "components/messages.html" %}
    <main>{% block content %}{% endblock %}</main>
    <footer class="site-footer">Building a cleaner, more valuable Zanzibar.</footer>
    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
