<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0F766E">
  <title>Offline | TakaPay</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#173b3f;background:#F7F8F3}
    *{box-sizing:border-box}body{display:grid;min-height:100vh;margin:0;padding:1.25rem;place-items:center}
    main{width:min(100%,30rem);padding:2rem;border:1px solid #cbd8d3;border-radius:.875rem;background:#fff}
    .mark{display:grid;width:3rem;height:3rem;margin-bottom:1.5rem;place-items:center;border-radius:.75rem;color:#fff;background:#0F766E;font-size:1.4rem;font-weight:800}
    h1{margin:0 0 .75rem;font-size:1.75rem;line-height:1.2}p{margin:0 0 1.25rem;color:#4d6867;line-height:1.6}
    button{min-height:2.75rem;padding:.65rem 1rem;border:0;border-radius:.375rem;color:#fff;background:#0F766E;font:inherit;font-weight:650}
    button:focus-visible{outline:3px solid #195f79;outline-offset:3px}
  </style>
</head>
<body><main><div class="mark" aria-hidden="true">T</div><h1>You’re offline</h1><p>TakaPay couldn’t reach the service. Reconnect and try again. Your account pages are not stored on this device for offline use.</p><button type="button" onclick="location.reload()">Try again</button></main></body>
</html>
